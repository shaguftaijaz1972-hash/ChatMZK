<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ChatMZK Signup</title>

<style>

body{
background:#202123;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.box{
background:#343541;
padding:40px;
border-radius:15px;
width:350px;
text-align:center;
}

h1{
color:white;
}

input{
width:100%;
padding:12px;
margin-top:15px;
border:none;
border-radius:8px;
font-size:16px;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
margin-top:20px;
background:#10a37f;
border:none;
color:white;
font-size:16px;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#0d8c6d;
}

a{
color:#10a37f;
text-decoration:none;
}

p{
color:white;
}

</style>

</head>

<body>

<div class="box">

<h1>Create Account</h1>

<form action="/signup" method="POST">

<input
type="text"
name="username"
placeholder="Username"
required>

<input
type="email"
name="email"
placeholder="Email"
required>

<input
type="password"
name="password"
placeholder="Password"
required>

<button type="submit">

Create Account

</button>

</form>

<p>

Already have an account?

<a href="/login">

Login

</a>

</p>

</div>

</body>

</html>
