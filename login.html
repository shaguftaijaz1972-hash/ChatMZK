<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ChatMZK Login</title>

<style>

body{

background:#202123;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;

}

.box{

background:#343541;
padding:40px;
border-radius:15px;
width:350px;
text-align:center;

}

h1{

color:white;

}

input{

width:100%;
padding:12px;
margin-top:15px;
border:none;
border-radius:8px;
font-size:16px;
box-sizing:border-box;

}

button{

width:100%;
padding:12px;
margin-top:20px;
background:#10a37f;
border:none;
color:white;
font-size:16px;
border-radius:8px;
cursor:pointer;

}

button:hover{

background:#0d8c6d;

}

a{

color:#10a37f;
text-decoration:none;

}

p{

color:white;

}

</style>

</head>

<body>

<div class="box">

<h1>ChatMZK</h1>

<p>Login to continue</p>
{% if error %}
<p style="color:red;">{{ error }}</p>
{% endif %}
<form action="/login" method="POST">

<input
type="email"
name="email"
placeholder="Email"
required>

<input
type="password"
name="password"
placeholder="Password"
required>

<button type="submit">

Login

</button>

</form>

<p>

Don't have an account?

<a href="/signup">

Create Account

</a>

</p>

</div>

</body>

</html>
